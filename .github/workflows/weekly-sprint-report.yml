name: Weekly SP Sprint Report

# Runs every Thursday at 07:00 UTC (08:00 BST in summer).
# Adjust the cron if you need a different time — note GitHub schedules use UTC.
# You can also run it on demand via the "Run workflow" button (workflow_dispatch).
on:
  schedule:
    - cron: "0 7 * * 4"   # min hour day-of-month month day-of-week(4 = Thursday)
  workflow_dispatch: {}

# Prevent two runs overlapping if a manual run coincides with the schedule.
concurrency:
  group: sprint-report
  cancel-in-progress: false

# The keepalive re-enables this workflow via the API (actions: write). No
# contents write is needed any more — we no longer push a commit to main.
permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key to disk
        # The secret holds the full service-account JSON. We pass it through the
        # environment (not interpolated into the command) so the shell never
        # interprets the backslash escapes inside the private_key field, then
        # write it verbatim with a tool that does no escape processing.
        # The file is deleted again in the cleanup step below.
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" > service_account.json
          python -c "import json; json.load(open('service_account.json')); print('service_account.json is valid JSON')"

      - name: Run sprint report refresh
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'SP' }}
          GCP_SA_KEY_PATH: service_account.json
        run: python src/refresh_sprint_report.py

      - name: Clean up service account key
        if: always()
        run: rm -f service_account.json

      # ---------------------------------------------------------------------
      # Keepalive. GitHub disables a scheduled workflow after 60 days with NO
      # repository activity. We keep it alive by calling the API to re-enable
      # this workflow on every run — this does NOT push a commit, so it is
      # unaffected by branch-protection rules on main (which require PRs and
      # would reject a direct push).
      #
      # We deliberately do NOT use the older "timestamp commit" approach: a push
      # to main is now blocked by the repo's pull-request rule, and a commit by
      # the built-in GITHUB_TOKEN never reliably reset the 60-day timer anyway.
      # The API re-enable below is the dependable mechanism.
      #
      # A keepalive only protects an otherwise-healthy job. If the real run above
      # has been failing for weeks (e.g. broken credentials) and nobody fixes it,
      # the workflow can still end up disabled — see HANDOVER.md troubleshooting.
      # ---------------------------------------------------------------------
      - name: Keepalive — ensure workflow stays enabled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-enable this workflow via the API in case it was auto-disabled.
          # Harmless no-op if it is already enabled.
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/weekly-sprint-report.yml/enable" \
            && echo "Workflow confirmed enabled." || echo "Enable call returned non-zero (often already enabled) — ignoring."
